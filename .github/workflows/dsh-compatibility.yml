name: dsh-compatibility

# Dependabot keeps the dev dependencies current, but it does not touch the `@deepseek-ai/*` entries in
# `peerDependencies` - those are the compatibility claim this repository makes one dsh release at a time,
# and a range bump there would declare support for a release nothing has verified. That leaves one hole:
# nothing notices a new dsh release. This job closes it by opening an issue when one is unmeasured.

on:
  schedule:
    # Weekly, Monday 03:17 UTC: after the ecosystem's usual release window, before the working week.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Which published dsh releases are not in the compatibility table
        id: check
        # The script exits 1 when a release needs a round, which is the signal, not a failure of the job.
        run: |
          set +e
          node scripts/check-dsh-compat.mjs | tee compat.txt
          echo "behind=$([ ${PIPESTATUS[0]} -eq 1 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          set -e

      - name: Open an issue, once
        if: steps.check.outputs.behind == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'A dsh release is published and not in `dsh.compatibility.dshReleases`.'
            echo
            echo '```'
            cat compat.txt
            echo '```'
            echo
            echo 'A round is what turns that into a claim: install through a profile'"'"'s package manager,'
            echo '`--dump-config`, the packaged skills, a headless boot, a real report from the installed copy,'
            echo 'uninstall - then record the row in `package.json` and the round in `DSH-COMPATIBILITY.md`.'
            echo 'The steps are in `RELEASE.md`; `compat-round.ps1` in the maintainer scratch tree runs them.'
          } > body.md
          existing="$(gh issue list --state open --search 'Compatibility round due in:title' --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "an open issue already tracks this; leaving it alone"
            exit 0
          fi
          gh issue create \
            --title 'Compatibility round due: a dsh release is unmeasured' \
            --body-file body.md
