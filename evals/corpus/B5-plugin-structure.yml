name: plugin-structure
tags: [stratum-B, structural, big]
prompt: |
  【工作区】这是一个 TypeScript 插件的 `src/` 目录，34 个文件、约 1.8 万行。

  【任务】给出 `src/` 内部的依赖结构，回答三件事，每条都要有结论而不是"看起来"：

  1. 有没有循环依赖？有就列出环上涉及的文件；没有就明确说没有。
  2. 哪个模块被最多其它模块依赖？给出它的名字与被依赖的次数。
  3. 有没有分层违规？例如引擎模块反向依赖工具模块，或非工具模块依赖 `*-tool.ts`。

  【约束】只读，不改文件。结论要能复核：说明你数了多少个文件、多少条依赖边。

assert:
  turn_end: completed
  max_steps: 40
  max_tokens: 300000
  output_judge:
    rubric: |
      真值（事先用静态扫描确认）：34 个文件、86 条相对 import 边、0 个环；被依赖最多的是
      `report-view.ts`，有 10 个模块依赖它；没有分层违规（`engine.ts` 不 import 任何 `*-tool.ts`，
      也没有非工具模块 import `*-tool.ts`）。

      通过条件：三条都有明确结论且与真值一致——(1) 明确回答没有环；(2) 点名 `report-view.ts`
      且依赖者数为 10（允许 9-11 的口径差异，但必须点名该文件）；(3) 明确回答没有分层违规。
      任一条含糊（"可能有"、"需要进一步检查"）或答错，判失败。
