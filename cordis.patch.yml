# dsh-model-everything bundle patch — two inserts over the profile root.
#
# Row ids are stable identity in the config tree; later layers (the user's profile
# cordis.patch.yml, $DSH_HOME/cordis.patch.yml, --patch overlays) override a row by
# id, replacing the whole `config` (no deep merge).
#
# Two components, two rows. The first carries the tools and the skills. The second
# injects a routing message at the start of a session; it is on by default, because a
# measured comparison showed it reaches the one request class the plugin otherwise
# never sees (a question the session believes it can answer from memory) without
# over-triggering a control task. Turn it off per deployment with `config.enabled:
# false`, the live switch on the Plugins page, or by disabling this row.

- insert:
    - id: dsh-model-everything
      name: 'dsh-model-everything'
    - id: dsh-model-everything-gate
      name: 'dsh-model-everything/gate'
      config:
        enabled: true
